server:
  port: 8081

spring:
  application:
    name: vitasync-backend
  elasticsearch:
    uris: http://localhost:9200

logging:
  level:
    com.vitasync.backend: INFO

# Origen permitido para las peticiones del frontend Angular (ng serve).
vitasync:
  cors:
    allowed-origin: http://localhost:4200
  # Práctica 10: control de acceso. true = toda petición a usuarios, smartwatch, chat y firmware debe traer
  # un token de Firebase Authentication válido y tocar solo cuentas propias (401 / 403 si no).
  # Se deja en false hasta que la app móvil inicie sesión con correo y contraseña.
  # Con el emulador de Authentication: variable de entorno FIREBASE_AUTH_EMULATOR_HOST=localhost:9099
  seguridad:
    activa: false
