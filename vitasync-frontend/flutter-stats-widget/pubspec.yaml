name: vitasync_stats_web
description: >
  Widget de estadisticas de productividad de VitaSync, compilado a Flutter
  Web y embebido como micro-frontend dentro del dashboard Angular
  (vitasync-frontend). Ver Practicas 7-8.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
