<!DOCTYPE html>
<html>
<head>
  <!-- La ruta base la fija «flutter build web --base-href /movil/». -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="VitaSync: tus datos de salud sincronizados con tu reloj (vista móvil, instalable como app).">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#00897B">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VitaSync">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>VitaSync</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Arranque propio (en vez de flutter_bootstrap.js) para NO registrar el service worker de Flutter, que ya no guarda la app para uso
       sin red, y registrar el de VitaSync (sw-vitasync.js, rúbrica C3). -->
  <script>
    {{flutter_js}}
    {{flutter_build_config}}
    _flutter.loader.load({
      onEntrypointLoaded: async function (engineInitializer) {
        const appRunner = await engineInitializer.initializeEngine();
        await appRunner.runApp();
      },
    });
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw-vitasync.js').catch(function (e) { console.warn('Sin service worker:', e); });
      });
    }
  </script>
</body>
</html>
