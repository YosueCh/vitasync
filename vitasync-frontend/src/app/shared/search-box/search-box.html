<!-- Botón de lupa que abre el buscador -->
<button type="button" class="search-trigger" (click)="abrir()" aria-label="Buscar en el sitio">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
  </svg>
</button>

<div class="search-overlay" *ngIf="abierto()" (click)="cerrar()">
  <div class="search-panel" (click)="$event.stopPropagation()">

    <div class="search-panel__input">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input
        #campoBusqueda
        type="text"
        placeholder="Buscar en VitaSync... (sueño, contacto, BLE)"
        [ngModel]="query"
        (ngModelChange)="onInput($event)"
      />
      <button type="button" class="search-panel__close" (click)="cerrar()" aria-label="Cerrar buscador">✕</button>
    </div>

    <div class="search-panel__results">
      <p *ngIf="buscando()" class="search-panel__hint">Buscando…</p>

      <p *ngIf="!buscando() && query && resultados().length === 0" class="search-panel__hint">
        Sin resultados para "<strong>{{ query }}</strong>".
      </p>

      <p *ngIf="!query" class="search-panel__hint">
        Escribe para buscar en todas las páginas del sitio sin salir de aquí.
      </p>

      <button type="button" class="search-result" *ngFor="let r of resultados()" (click)="irAResultado(r)">
        <span class="search-result__categoria">{{ r.categoria }}</span>
        <span class="search-result__titulo">{{ r.titulo }}</span>
        <span class="search-result__snippet">{{ r.contenido }}</span>
      </button>
    </div>
  </div>
</div>
